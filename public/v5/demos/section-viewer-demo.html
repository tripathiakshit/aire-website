<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>El-Dorado - Atlantis - Alteration Long Section</title>
<style>
  :root{--bg:#0c0f15;--panel:#121925;--line:#26324a;--txt:#e6edf7;--dim:#92a4bd;--accent:#ff8a5c}
  *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,Arial,sans-serif}
  #top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:#0a0e14;position:sticky;top:0;z-index:5;flex-wrap:wrap}
  #brandLogo{height:26px}#top .ttl{font-weight:700;font-size:15px}#top .sub{color:var(--dim);font-size:11.5px}.sp{flex:1}
  .legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .lz{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim)}.lz .sw{width:13px;height:13px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
  #wrap{max-width:1100px;margin:0 auto;padding:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .ck{display:flex;align-items:center;gap:7px;font-size:12.5px;cursor:pointer}.ck input{accent-color:var(--accent)}
  .rng{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}.rng input{width:130px}
  .hint{font-size:10.5px;color:var(--dim);line-height:1.5;margin-top:8px}
  svg{display:block;background:#0a0e14;border:1px solid var(--line);border-radius:8px;width:100%;height:auto}
  text{fill:var(--txt)}.ax{stroke:#2a3550}.axt{fill:#8aa0bd;font-size:10px}
</style></head><body>

<script>
function __load(s){var bin=atob(s.trim());var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
const D=JSON.parse(__load(document.getElementById('sec-data').textContent));
const Z=D.zones, ZC=Z.map(z=>z.color), S=D.section;
document.getElementById('subttl').textContent=D.meta.subtitle;
document.getElementById('prov').textContent=D.meta.provenance+' The coloured cells are an interpolated alteration model (potassic core to phyllic/silicic to argillic/propylitic halo); the thicker line segments are drill-logged alteration within '+D.meta.slab+' m of the section, projected on.';
document.getElementById('legend').innerHTML=Z.slice(0,6).map(z=>'<span class="lz"><span class="sw" style="background:'+z.color+'"></span>'+z.name+'</span>').join('');
['vex','ckZone','ckTrace','ckTopo','ckColl'].forEach(id=>{const e=document.getElementById(id);e.oninput=e.onchange=()=>{if(id==='vex')document.getElementById('vexv').textContent=parseFloat(e.value).toFixed(1)+'x';render();};});
function render(){ const o={zone:ckZone.checked,trace:ckTrace.checked,topo:ckTopo.checked,coll:ckColl.checked,exag:parseFloat(vex.value)};
  const W=1060,H=620,m=52, cell=S.cell; const uW=S.u1, vH=(S.v1-S.v0);
  const s=Math.min((W-m-16)/uW,(H-m-24)/(vH*o.exag)); const sx=s, sy=s*o.exag;
  const X=u=>m+u*sx, Y=v=>20+(S.v1-v)*sy;
  let g='<svg viewBox="0 0 '+W+' '+H+'">';
  g+='<rect x="'+m+'" y="20" width="'+(W-m-16)+'" height="'+((S.v1-S.v0)*sy).toFixed(1)+'" fill="none" stroke="#26324a"/>';
  for(let rl=0;rl>=S.v0;rl-=200){const y=Y(rl).toFixed(1);g+='<line class="ax" x1="'+m+'" y1="'+y+'" x2="'+(W-16)+'" y2="'+y+'" opacity="0.35"/><text class="axt" x="'+(m-4)+'" y="'+(+y+3)+'" text-anchor="end">'+(rl===0?'datum':rl+' m')+'</text>';}
  for(let u=0;u<=S.u1;u+=400){const xx=X(u).toFixed(1);g+='<line class="ax" x1="'+xx+'" y1="20" x2="'+xx+'" y2="'+Y(S.v0).toFixed(1)+'" opacity="0.3"/><text class="axt" x="'+xx+'" y="'+(Y(S.v0)+14).toFixed(1)+'" text-anchor="middle">'+u+'</text>';}
  g+='<text class="axt" x="'+(m+(W-m-16)/2)+'" y="'+(H-6)+'" text-anchor="middle">Chainage along section (m, local grid)</text>';
  g+='<text class="axt" transform="translate(13,'+(H/2)+') rotate(-90)" text-anchor="middle">Elevation below local datum (m)</text>';
  if(o.zone){for(const c of S.cells){const cw=Math.max(1.2,cell*sx),ch=Math.max(1.0,c[2]*sy);
    g+='<rect x="'+(X(c[0])-cw/2).toFixed(1)+'" y="'+(Y(c[1])-ch/2).toFixed(1)+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" fill="'+ZC[c[3]]+'" opacity="0.62"/>';}}
  if(o.topo&&S.topo.length>1){const pts=S.topo.map(t=>X(t[0]).toFixed(1)+','+Y(t[1]).toFixed(1)).join(' ');
    g+='<polyline points="'+pts+'" fill="none" stroke="#caa46a" stroke-width="1.8" opacity="0.95"/>';}
  if(o.trace)for(const t of S.traces) g+='<line x1="'+X(t[0]).toFixed(1)+'" y1="'+Y(t[1]).toFixed(1)+'" x2="'+X(t[2]).toFixed(1)+'" y2="'+Y(t[3]).toFixed(1)+'" stroke="'+ZC[t[4]]+'" stroke-width="2.6" stroke-linecap="round"/>';
  if(o.coll)for(const c of S.collars){const cx=X(c.u),cy=Y(c.v);
    g+='<path d="M'+(cx-4)+','+(cy-7)+' L'+(cx+4)+','+(cy-7)+' L'+cx+','+cy+' Z" fill="#dfe8f5" stroke="#0a0e14" stroke-width="0.5"/>';
    g+='<text x="'+cx+'" y="'+(cy-9)+'" font-size="9" fill="#cdd8e8" text-anchor="middle">'+c.id+'</text>';}
  g+='<text x="'+m+'" y="13" font-weight="700" font-size="13" fill="#fff">LONG SECTION - alteration zonation (demonstration)</text>';
  g+='<text x="'+(W-16)+'" y="13" text-anchor="end" font-size="10" fill="#92a4bd">zones: '+S.zones_present.join(' / ')+' | local grid, no real coordinates</text>';
  g+='</svg>'; document.getElementById('main').innerHTML=g;
}
render();
</script></body></html>
